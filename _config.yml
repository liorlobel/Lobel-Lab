# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: The Lobel Lab
email: lior@llobel.online
google_analytics: G-4MK6ESQEE8
description: > # this means to ignore newlines until "baseurl:"
  Website of the Lobel Lab.
baseurl: "/Lobel-Lab"
url: "https://liorlobel.github.io"

# Link-preview metadata (used by jekyll-seo-tag for Open Graph cards)
logo: /images/Lobel_lab_logo.jpg
defaults:
  - scope:
      path: ""
    values:
      image: /images/Lobel_lab_logo.jpg

include:
  - _pages

sass:
  sass_dir: _sass

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false



# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true # default for kramdown is false. This will enable using Markdown links

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  